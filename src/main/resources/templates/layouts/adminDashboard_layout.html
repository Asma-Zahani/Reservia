<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/layout :: layout}" th:fragment="adminDashboard_layout">

<div th:fragment="content">
    <!-- page header -->
    <div class="rts__section page__hero__height page__hero__bg"  th:style="'background-image: url(' + @{/images/pages/header___bg.webp} + ')'">
        <div class="container">
            <div class="row align-items-center justify-content-center">
                <div class="col-lg-12">
                    <div class="page__hero__content">
                        <h1 class="wow fadeInUp">Admin Dashboard</h1>
                        <p class="wow fadeInUp font-sm">Manage users, bookings, rooms and platform settings.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- page header end -->

    <div class="rts__section section__padding">
        <div class="container">
            <div class="row g-4 main__content sticky-wrap">
                <!-- SIDEBAR -->
                <div class="col-12 col-md-4">
                    <div class="account-sidebar p-4">
                        <ul class="list-unstyled m-0 px-3">
                            <li th:classappend="${activePage == 'dashboard'} ? 'active'">
                                <a th:href="@{/admin/dashboard}"><i class="fa fa-dashboard me-2"></i>Dashboard</a>
                            </li>
                            <li th:classappend="${activePage == 'users'} ? 'active'">
                                <a th:href="@{/admin/users}"><i class="fa fa-users me-2"></i>Users</a>
                            </li>
                            <li th:classappend="${activePage == 'bookings'} ? 'active'">
                                <a th:href="@{/admin/bookings}"><i class="fa fa-calendar me-2"></i>Bookings</a>
                            </li>
                            <li th:classappend="${activePage == 'rooms'} ? 'active'">
                                <a th:href="@{/admin/rooms}"><i class="fa fa-bed me-2"></i>Rooms</a>
                            </li>
                            <li th:classappend="${activePage == 'settings'} ? 'active'">
                                <a th:href="@{/admin/settings}"><i class="fa fa-cog me-2"></i>Settings</a>
                            </li>
                        </ul>

                        <hr>

                        <div class="d-grid">
                            <a th:href="@{/dashboard}" class="theme-btn btn-style sm-btn border text-center">
                                <span><i class="fa fa-user me-2"></i>My Account</span>
                            </a>
                            <div class="my-3" data-bs-toggle="modal" data-bs-target="#logoutModal">
                                <button type="button" class="theme-btn btn-style sm-btn border w-100">
                                    <span><i class="fa fa-sign-out me-2"></i>Log Out</span>
                                </button>
                            </div>
                        </div>

                    </div>

                </div>

                <!-- CONTENT -->
                <div class="col-12 col-md-8 py-4">
                    <div th:insert="~{::content_adminDashboard}"></div>
                </div>
            </div>
        </div>
    </div>

</div>

</html>
