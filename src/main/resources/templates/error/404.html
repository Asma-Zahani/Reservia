<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>This Page Does Not Exist</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        body {
            color: #1d1e20;
            background: #f4f5ff;

            font-size: 14px;
            font-weight: 400;
            -ms-text-size-adjust: 100%;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .page-not-found {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            padding: 0 16px;

            img {
                vertical-align: middle;
                border-style: none;
            }

            .image {
                max-width: 40%;
                margin-bottom: 15px;
                height: auto;
                object-fit: contain;
            }

            .title {
                text-align: center;
                margin-top: 0;
                margin-bottom: 8px;
                font-size: 24px;
                line-height: 32px;
                font-weight: 700;
            }

            .text {
                text-align: center;
                max-width: 650px;
                margin-bottom: 24px;
                font-size: 16px;
                line-height: 24px;
                font-weight: 400;
                color: #6D7081;
            }
        }
    </style>
</head>
<body>
<div class="page-not-found">
    <img class="image" alt="Page Not Found" th:src="@{/images/icon/404.svg}" />
    <h1 class="title">This Page Does Not Exist</h1>
    <p class="text">
        Sorry, the page you are looking for could not be found. It's just an
        accident that was not intentional.
    </p>
</div>
</body>


</html>
