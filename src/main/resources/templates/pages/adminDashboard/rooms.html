<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/adminDashboard_layout :: adminDashboard_layout}">

<div th:fragment="content_adminDashboard">

    <div class="d-flex justify-content-between align-items-center mb-3">

        <div>
            <h4>Rooms Management</h4>
            <p class="form-subtitle">
                Manage all hotel rooms, pricing and availability.
            </p>
        </div>

        <div class="my-3" data-bs-toggle="modal" data-bs-target="#addRoomModal">
            <button type="button" class="theme-btn btn-style sm-btn fill w-100">
                <span><i class="fa fa-plus me-2"></i>Add Room</span>
            </button>
        </div>

    </div>

    <div th:if="${#lists.isEmpty(rooms)}">
        <p>No rooms found.</p>
    </div>

    <table class="table table-striped"
           th:if="${!#lists.isEmpty(rooms)}">

        <thead>
            <tr>
                <th>Image</th>
                <th>Type</th>
                <th>Size</th>
                <th>Capacity</th>
                <th>Price</th>
                <th>Actions</th>
            </tr>
        </thead>

        <tbody>

            <tr th:each="room, iterStat : ${rooms}">
                <td>
                    <img th:src="@{${room.image_path}}" alt="room" style="width:70px;height:50px;object-fit:cover;border-radius:6px;">
                </td>
                <td th:text="${room.type}"></td>
                <td><span th:text="${room.size + ' m²'}"></span></td>
                <td><span th:text="${room.capacity + ' Guests'}"></span></td>
                <td th:text="${room.price + ' TND'}"></td>
                <td class="px-4 gap-3">
                    <a href="#" style="margin-right:5px;">
                        <i class="fas fa-edit"></i>
                    </a>

                    <a href="#" style="color:red;" data-bs-toggle="modal" th:data-bs-target="'#deleteModal' + ${room.id}">
                        <i class="fas fa-trash"></i>
                    </a>

                    <!-- DELETE MODAL -->
                    <div class="modal fade"
                         th:id="'deleteModal' + ${room.id}"
                         tabindex="-1">

                        <div class="modal-dialog modal-dialog-centered">

                            <div class="modal-content">

                                <div class="modal-header">

                                    <h5 class="modal-title">Delete Room</h5>

                                    <button type="button"
                                            class="btn-close"
                                            data-bs-dismiss="modal">
                                    </button>

                                </div>

                                <div class="modal-body">

                                    <p>
                                        Do you really want to delete
                                        <strong th:text="${room.type}"></strong> ?
                                    </p>

                                </div>

                                <div class="modal-footer">

                                    <button type="button"
                                            class="theme-btn btn-style border"
                                            data-bs-dismiss="modal">
                                        <span>Cancel</span>
                                    </button>

                                    <form th:action="@{/admin/rooms/delete/{id}(id=${room.id})}"
                                          method="post">

                                        <button type="submit"
                                                class="theme-btn btn-style fill">
                                            <span>Delete</span>
                                        </button>

                                    </form>

                                </div>

                            </div>

                        </div>

                    </div>

                </td>
            </tr>
        </tbody>

    </table>

    <!-- PAGINATION -->
    <nav class="simple-pagination"
         th:if="${totalPages > 1}">

        <a th:if="${currentPage > 0}"
           th:href="@{/admin/rooms(page=${currentPage - 1})}">
            ←
        </a>

        <a th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
           th:href="@{/admin/rooms(page=${i})}"
           th:text="${i + 1}"
           th:classappend="${i == currentPage} ? 'active' : ''">
        </a>

        <a th:if="${currentPage < totalPages - 1}"
           th:href="@{/admin/rooms(page=${currentPage + 1})}">
            →
        </a>

    </nav>

    <!-- ADD ROOM MODAL -->
    <div class="modal fade" id="addRoomModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content">

                <!-- HEADER -->
                <div class="modal-header">
                    <h5 class="modal-title">Add New Room</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <!-- BODY -->
                <div class="modal-body">

                    <form th:action="@{/admin/rooms/add}" method="post" class="row g-3">
                        <div class="col-12">
                            <label class="form-label">Room Image</label>
                            <input type="file" name="image" class="form-control" accept="image/*" onchange="previewImage(event)">
                        </div>

                        <!-- IMAGE PREVIEW -->
                        <div class="col-12 d-flex justify-content-center">
                            <div class="image-preview-box">
                                <img id="imagePreview" src="#" alt="Image Preview">
                            </div>
                        </div>

                        <!-- TYPE -->
                        <div class="col-md-6">
                            <label class="form-label">Type</label>
                            <input type="text"
                                   name="type"
                                   class="form-control"
                                   placeholder="e.g. Deluxe, Suite">
                        </div>

                        <!-- SIZE -->
                        <div class="col-md-6">
                            <label class="form-label">Size (m²)</label>
                            <input type="number"
                                   name="size"
                                   class="form-control"
                                   min="1">
                        </div>

                        <!-- CAPACITY -->
                        <div class="col-md-6">
                            <label class="form-label">Capacity</label>
                            <input type="number"
                                   name="capacity"
                                   class="form-control"
                                   min="1">
                        </div>

                        <!-- PRICE -->
                        <div class="col-md-6">
                            <label class="form-label">Price (TND)</label>
                            <input type="number"
                                   step="0.01"
                                   name="price"
                                   class="form-control"
                                   min="0">
                        </div>

                        <!-- DESCRIPTION -->
                        <div class="col-12">
                            <label class="form-label">Description</label>
                            <textarea name="description"
                                      class="form-control"
                                      rows="4"
                                      placeholder="Room description..."></textarea>
                        </div>

                        <!-- SUBMIT -->
                        <div class="col-12">
                            <button type="submit"
                                    class="theme-btn btn-style fill w-100">
                                <span>Add Room</span>
                            </button>
                        </div>

                    </form>

                </div>

            </div>
        </div>
    </div>

    <script>
        function previewImage(event) {
            const input = event.target;
            const previewBox = document.querySelector(".image-preview-box");
            const preview = document.getElementById("imagePreview");

            if (input.files && input.files[0]) {
                const reader = new FileReader();

                reader.onload = function(e) {
                    preview.src = e.target.result;
                    previewBox.style.display = "flex";
                }

                reader.readAsDataURL(input.files[0]);
            }
        }
    </script>
</div>

</html>
