<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/adminDashboard_layout :: adminDashboard_layout}">

<div th:fragment="content_adminDashboard">

    <div class="container mt-4">

        <h2 class="mb-4">Hotel Settings</h2>

        <form th:action="@{/admin/settings}"
              th:object="${settings}"
              method="post">

            <input type="hidden" th:field="*{id}">

            <!-- Hotel Name -->
            <div class="mb-3">
                <label class="form-label">Hotel Name</label>
                <input type="text"
                       class="form-control"
                       th:field="*{hotelName}">
            </div>

            <!-- Email -->
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email"
                       class="form-control"
                       th:field="*{email}">
            </div>

            <!-- Phone -->
            <div class="mb-3">
                <label class="form-label">Phone</label>
                <input type="text"
                       class="form-control"
                       th:field="*{phone}">
            </div>

            <!-- Address -->
            <div class="mb-3">
                <label class="form-label">Address</label>
                <input type="text"
                       class="form-control"
                       th:field="*{address}">
            </div>

            <!-- Button -->
            <div class="form-actions">
                <button type="submit" class="theme-btn btn-style fill">
                    <span>Save Changes</span>
                </button>
            </div>
        </form>

    </div>

</div>

</html>s
