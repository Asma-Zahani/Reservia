<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/adminDashboard_layout :: adminDashboard_layout}">

<div th:fragment="content_adminDashboard">

    <h4>Hotel Settings</h4>

    <p class="form-subtitle">
        Update hotel information including name, contact details, and address.
    </p>

    <form th:action="@{/admin/settings}"
          th:object="${settings}"
          method="post">

        <input type="hidden" th:field="*{id}">

        <div class="row">
            <!-- Hotel Name -->
            <div class="mb-3 col-md-4">
                <label class="form-label">Hotel Name</label>
                <input type="text"
                       class="form-control"
                       th:field="*{hotelName}">
            </div>

            <!-- Phone -->
            <div class="mb-3 col-md-8">
                <label class="form-label">Address</label>
                <input type="text"
                       class="form-control"
                       th:field="*{address}">
            </div>
        </div>

        <div class="row">
            <!-- Hotel Name -->
            <div class="mb-3 col-md-8">
                <label class="form-label">Email</label>
                <input type="email"
                       class="form-control"
                       th:field="*{email}">
            </div>

            <!-- Phone -->
            <div class="mb-3 col-md-4">
                <label class="form-label">Phone</label>
                <input type="text"
                       class="form-control"
                       th:field="*{phone}">
            </div>
        </div>

        <!-- Button -->
        <div class="form-actions">
            <button type="submit" class="theme-btn btn-style fill">
                <span>Save Changes</span>
            </button>
        </div>
    </form>


</div>

</html>s
