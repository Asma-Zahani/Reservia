<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/dashboard_layout :: dashboard_layout}">

<div th:fragment="content_dashboard">
    <h4>My Bookings</h4>
    <p class="form-subtitle">
        Here you can view all your bookings, check their details, and manage them easily.
    </p>

    <!-- Message si aucune réservation -->
    <div th:if="${#lists.isEmpty(bookings)}">
        <p>No booking found.</p>
    </div>

    <!-- Table des réservations -->
    <table class="table" th:if="${!#lists.isEmpty(bookings)}">
        <thead>
        <tr>
            <th>ID</th>
            <th>Date de réservation</th>
            <th>Statut</th>
            <th>Total</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="booking : ${bookings}">
            <td th:text="${booking.id}"></td>
            <td th:text="${booking.bookingDate}"></td>
            <td th:text="${booking.status}"></td>
            <td th:text="${booking.totalPrice}"></td>
            <td>
                <!-- View details -->
                <a th:href="@{/dashboard/booking/view/{id}(id=${booking.id})}" title="View Details" style="margin-right:5px;">
                    <i class="fas fa-eye"></i>
                </a>

                <!-- Modifier -->
                <a th:href="@{/dashboard/booking/edit/{id}(id=${booking.id})}" title="Edit" style="margin-right:5px;">
                    <i class="fas fa-edit"></i>
                </a>

                <!-- Supprimer -->
                <form th:action="@{/dashboard/booking/delete/{id}(id=${booking.id})}" method="post" th:object="${booking}" style="display:inline;">
                    <input type="hidden" name="_method" value="delete"/>
                    <button type="submit" title="Delete" style="background:none;border:none;color:red;cursor:pointer;"
                            onclick="return confirm('Are you sure?')">
                        <i class="fas fa-trash"></i>
                    </button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>

</html>
