<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>New Contact Message</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f4f7fb; margin:0; padding:0;">
<table width="100%" cellpadding="0" cellspacing="0" style="padding:40px 0;">
    <tr>
        <td align="center">
            <table width="600" cellpadding="0" cellspacing="0" style="background:#ffffff; border-radius:12px; padding:30px;">
                <tr>
                    <td>
                        <h2 style="color:#2563eb;">New Contact Message</h2>
                        <p><strong>Name:</strong> <span th:text="${name}"></span></p>
                        <p><strong>Email:</strong> <span th:text="${email}"></span></p>
                        <p><strong>Message:</strong></p>
                        <p th:text="${messageContent}" style="background:#f3f4f6; padding:10px; border-radius:6px;"></p>
                    </td>
                </tr>
                <tr>
                    <td style="padding-top:20px; font-size:12px; color:#6b7280;">
                        This message was sent via the contact form on Reservia.
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
